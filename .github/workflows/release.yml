name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify tag matches package.json version
        run: |
          pkg="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version ($pkg) does not match tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs a current npm; the Node-bundled one
      # may predate support. The diagnostic line makes the next auth failure
      # self-explaining: no ACTIONS_ID_TOKEN vars → workflow context problem;
      # vars present but publish ENEEDAUTHs → npmjs.com trusted-publisher
      # config mismatch (must be repo queso/promptdiff, workflow release.yml,
      # matched case-sensitively).
      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@latest
          echo "node=$(node --version) npm=$(npm --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC vars: present"
          else
            echo "OIDC vars: MISSING — id-token permission not reaching this job"
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
      # release-please normally creates the GitHub release; this covers
      # manually pushed tags (like the initial v1.0.0) without duplicating.
      - name: Create GitHub release if missing
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
